name: feed-cron

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Warm ANPOST feed
        env:
          ANPOST_URL: ${{ secrets.ANPOST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ANPOST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skip: set ANPOST_URL and CRON_SECRET repo secrets for scheduled warm."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "${ANPOST_URL%/}/api/cron/feed"
